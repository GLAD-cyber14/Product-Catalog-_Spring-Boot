name: Keep Render App Awake

on:
  schedule:
    # Safely wrapped in double quotes and changed to 10 minutes to beat delays
    - cron: "*/10 * * * *"

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://product-catalog-spring-boot.onrender.com
