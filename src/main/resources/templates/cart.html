<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head th:replace="~{layout :: header-fragment('My Cart')}"></head>

<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">🛒 My Cart</h2>

        <a th:href="@{/products}" class="btn btn-outline-primary">
            Continue Shopping
        </a>
    </div>

    <!-- Empty cart -->
    <div th:if="${cartItems == null or cartItems.isEmpty()}"
         class="text-center py-5">

        <h4>Your cart is empty</h4>
        <p class="text-muted">
            Add some products to your cart to see them here.
        </p>

        <a th:href="@{/products}" class="btn btn-primary">
            Browse Products
        </a>

    </div>

    <!-- Cart has products -->
    <div th:if="${cartItems != null and !cartItems.isEmpty()}">

        <div class="row g-4">

            <!-- Cart items -->
            <div class="col-lg-8">

                <div class="card shadow-sm border-0 mb-3"
                     th:each="item : ${cartItems}">

                    <div class="card-body">

                        <div class="row align-items-center">

                            <!-- Product image -->
                            <div class="col-md-2 text-center">

                                <img th:if="${item.product.image != null}"
                                     th:src="@{${item.product.image}}"
                                     alt="Product"
                                     class="img-fluid rounded"
                                     style="max-height:100px; object-fit:contain;">

                            </div>

                            <!-- Product information -->
                            <div class="col-md-3">

                                <h5 class="fw-bold"
                                    th:text="${item.product.name}">
                                    Product Name
                                </h5>

                                <p class="text-muted mb-1">
                                    Price:
                                    ₹<span th:text="${item.product.price}">
                                        0
                                    </span>
                                </p>

                                <p class="text-muted mb-0">
                                    Available:
                                    <span th:text="${item.product.stock}">
                                        0
                                    </span>
                                </p>

                            </div>

                            <!-- Quantity -->
                            <div class="col-md-3">

                                <div class="d-flex align-items-center justify-content-center gap-2">

                                    <form th:action="@{'/cart/decrease/' + ${item.id}}"
                                          method="post">

                                        <button type="submit"
                                                class="btn btn-outline-secondary btn-sm">
                                            −
                                        </button>

                                    </form>

                                    <span class="fw-bold px-2"
                                          th:text="${item.quantity}">
                                        1
                                    </span>

                                    <form th:action="@{'/cart/increase/' + ${item.id}}"
                                          method="post">

                                        <button type="submit"
                                                class="btn btn-outline-secondary btn-sm">
                                            +
                                        </button>

                                    </form>

                                </div>

                            </div>

                            <!-- Subtotal -->
                            <div class="col-md-2 text-center">

                                <span class="fw-bold">
                                    ₹<span
                                        th:text="${item.product.price * item.quantity}">
                                        0
                                    </span>
                                </span>

                            </div>

                            <!-- Remove -->
                            <div class="col-md-2 text-end">

                                <form th:action="@{'/cart/remove/' + ${item.id}}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-outline-danger btn-sm">
                                        Remove
                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Cart summary -->
            <div class="col-lg-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h4 class="fw-bold mb-4">
                            Cart Summary
                        </h4>

                        <div class="d-flex justify-content-between mb-3">

                            <span>
                                Items
                            </span>

                            <span class="fw-bold"
                                  th:text="${#lists.size(cartItems)}">
                                0
                            </span>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <span class="fw-bold">
                                Total
                            </span>

                            <span class="fw-bold fs-4">

                               ₹<span th:text="${cartTotal}">
                                0
                                  </span>

                            </span>

                        </div>

                        <a th:href="@{/checkout}"
                           class="btn btn-success w-100 mt-4">
                            Proceed to Checkout
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<!-- Bootstrap JS -->
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
