<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit User</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>


<body class="bg-light">


<div th:replace="~{layout :: navbar}"></div>


<div class="container py-5">


    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">


                    <h2 class="fw-bold mb-4">
                        Edit User
                    </h2>


                    <form th:action="@{/admin/users/edit/{id}(id=${user.id})}"
                          method="post"
                          enctype="multipart/form-data">


                        <!-- ========================================= -->
                        <!-- CURRENT PROFILE IMAGE -->
                        <!-- ========================================= -->

                        <div class="text-center mb-4">

                            <div th:if="${user.profileImage != null
                                         and !user.profileImage.isEmpty()}">

                                <img th:src="@{'/uploads/' + ${user.profileImage}}"
                                     th:alt="${user.firstName + ' ' + user.lastName}"
                                     style="
                                         width: 120px;
                                         height: 120px;
                                         object-fit: cover;
                                         border-radius: 50%;
                                         border: 3px solid #dee2e6;
                                     ">

                            </div>


                            <div th:unless="${user.profileImage != null
                                              and !user.profileImage.isEmpty()}">

                                <div style="
                                    width: 120px;
                                    height: 120px;
                                    border-radius: 50%;
                                    background: #e9ecef;
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    margin: auto;
                                    font-size: 50px;
                                ">

                                    👤

                                </div>

                            </div>

                        </div>



                        <!-- FIRST NAME -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                First Name
                            </label>

                            <input type="text"
                                   name="firstName"
                                   class="form-control"
                                   th:value="${user.firstName}"
                                   required>

                        </div>



                        <!-- LAST NAME -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Last Name
                            </label>

                            <input type="text"
                                   name="lastName"
                                   class="form-control"
                                   th:value="${user.lastName}"
                                   required>

                        </div>



                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Username
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   th:value="${user.username}"
                                   required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   th:value="${user.email}"
                                   placeholder="Enter email address"
                                   required>

                        </div>





                        <!-- ROLE -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Role
                            </label>

                            <select name="role"
                                    class="form-select"
                                    required>

                                <option value="USER"
                                        th:selected="${user.role == 'USER'}">

                                    USER

                                </option>

                                <option value="ADMIN"
                                        th:selected="${user.role == 'ADMIN'}">

                                    ADMIN

                                </option>

                            </select>

                        </div>



                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                New Password

                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Leave blank to keep current password">

                        </div>



                        <!-- PROFILE IMAGE -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Change Profile Picture

                            </label>

                            <input type="file"
                                   name="profileImage"
                                   class="form-control"
                                   accept="image/*">

                        </div>



                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">

                                💾 Save Changes

                            </button>


                            <a th:href="@{/admin/users}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>


                </div>

            </div>

        </div>

    </div>


</div>


</body>

</html>
