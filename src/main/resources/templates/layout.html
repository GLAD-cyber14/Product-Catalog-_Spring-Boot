<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en">
<!-- Fragment 1: Shared Header -->
<head th:fragment="header-fragment(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">Product Catalog</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Product Page CSS -->
    <link rel="stylesheet" th:href="@{/css/products.css}">

    <!-- Top Loading Bar Styles -->
    <style>
        .loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #0d6efd;
            z-index: 99999;
            transition: width 0.3s ease-out, opacity 0.3s ease-in;
            opacity: 0;
        }
        .loading-bar.loading {
            opacity: 1;
            width: 75%;
        }
        .loading-bar.complete {
            width: 100%;
            opacity: 0;
        }

        /* Mobile-Friendly Cart Badge Styles */
        #cart-badge {
            padding: 0.25em 0.5em;
            font-weight: 700;
            line-height: 1;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg modern-navbar" th:fragment="navbar">

    <!-- Top Loading Progress Bar Element -->
    <div id="loading-bar" class="loading-bar"></div>

    <div class="container-fluid px-4">

        <!-- Brand -->
        <a class="navbar-brand modern-brand" th:href="@{/}">
            <img th:src="@{/images/gladwin-logo.png}"
                 alt="Gladwin Premium Product Store"
                 class="gladwin-logo">
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="mainNavbar">

            <div class="ms-auto d-flex gap-2 align-items-center flex-wrap">

                <a th:href="@{/}" class="nav-item-link">Home</a>

                <a th:href="@{/products}" class="nav-item-link">Products</a>

                <!-- Admin Orders -->
                <a th:href="@{/admin/orders}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📦 All Orders
                </a>

                <!-- Cart with Inline Mobile-Friendly Badge -->
                <a th:href="@{/cart}" class="nav-item-link d-inline-flex align-items-center gap-2">
                    <span>🛒 Cart</span>
                    <span id="cart-badge" class="badge rounded-pill bg-danger" style="display: none; font-size: 0.65rem;">
                        0
                    </span>
                </a>

                <!-- My Orders -->
                <a th:href="@{/orders}"
                   class="nav-item-link"
                   sec:authorize="isAuthenticated()">
                    📦 My Orders
                </a>

                <a th:href="@{/admin/dashboard}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📊 Dashboard
                </a>

                <a th:href="@{/admin/category}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    Categories
                </a>

                <a th:href="@{/admin/users}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    User Management
                </a>

                <a th:href="@{/profile}" class="btn btn-light">
                    👤 My Profile
                </a>

                <!-- Login -->
                <a th:href="@{/login}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Login
                </a>

                <!-- Register -->
                <a th:href="@{/register}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Register
                </a>

                <!-- Logout -->
                <form th:action="@{/logout}"
                      method="post"
                      th:if="${#authorization.expression('isAuthenticated()')}"
                      style="display:inline;">
                    <button type="submit" class="nav-item-link">
                        Logout
                    </button>
                </form>

            </div>

        </div>

    </div>

</nav>

<!-- Fragment 3: Shared JavaScript Dependencies & Universal Handlers -->
<div th:fragment="scripts">
    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Universal CSS Spinner & Loader Styles -->
    <style>
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: btn-spin 0.4s linear infinite;
            vertical-align: -2px;
            margin-right: 6px;
        }

        .btn-spinner-lg {
            width: 36px;
            height: 36px;
            border-width: 3px;
            border-color: #0d6efd;
            border-right-color: transparent;
            margin-right: 0;
        }

        @keyframes btn-spin {
            to { transform: rotate(360deg); }
        }

        .btn-loading {
            opacity: 0.85;
            cursor: not-allowed !important;
            pointer-events: none;
        }

        /* Centered Full Screen Overlay */
        #global-screen-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }

        #global-screen-loader.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loader-card {
            background: #ffffff;
            padding: 24px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loader-card-text {
            font-size: 14px;
            font-weight: 500;
            color: #495057;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>

    <script>
        // Global localStorage Cart Synchronizer
        function getCartData() {
            try {
                return JSON.parse(localStorage.getItem("gladwin_cart")) || {};
            } catch (e) {
                return {};
            }
        }

        function saveCartData(cart) {
            localStorage.setItem("gladwin_cart", JSON.stringify(cart));
            updateGlobalCartBadge();
        }

        function updateGlobalCartBadge() {
            const cart = getCartData();
            let totalItems = 0;
            Object.values(cart).forEach(qty => {
                totalItems += qty;
            });

            const badge = document.getElementById("cart-badge");
            if (badge) {
                if (totalItems > 0) {
                    badge.style.display = "inline-block";
                    badge.textContent = totalItems;
                } else {
                    badge.style.display = "none";
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            // Synchronize cart badge on load
            updateGlobalCartBadge();

            // Inject full-screen loader modal dynamically if absent
            let fullLoader = document.getElementById("global-screen-loader");
            if (!fullLoader) {
                fullLoader = document.createElement("div");
                fullLoader.id = "global-screen-loader";
                fullLoader.innerHTML = `
                    <div class="loader-card">
                        <span class="btn-spinner btn-spinner-lg"></span>
                        <span class="loader-card-text">Processing...</span>
                    </div>
                `;
                document.body.appendChild(fullLoader);
            }

            function showScreenLoader() {
                fullLoader.classList.add("active");
            }

            function hideScreenLoader() {
                fullLoader.classList.remove("active");
            }

            // Universal form submit handler (Button spinner + centered overlay)
            document.addEventListener("submit", function (e) {
                const form = e.target;
                if (!form) return;

                const submitBtn = form.querySelector('button[type="submit"], input[type="submit"]');
                if (submitBtn && !submitBtn.classList.contains("no-spinner")) {
                    submitBtn.classList.add("btn-loading");
                    submitBtn.disabled = true;

                    if (!submitBtn.querySelector(".btn-spinner")) {
                        const spinner = document.createElement("span");
                        spinner.className = "btn-spinner";
                        submitBtn.prepend(spinner);
                    }
                }
                showScreenLoader();
            });

            // Universal link navigation loader
            document.addEventListener("click", function (e) {
                const link = e.target.closest("a");
                if (!link) return;

                const href = link.getAttribute("href");
                if (!href || href === "#" || href.startsWith("javascript") || link.target === "_blank") return;
                if (link.hostname && link.hostname !== window.location.hostname) return;
                if (link.hasAttribute("data-bs-toggle")) return;

                showScreenLoader();
            });

            // Restore state on navigation restore
            window.addEventListener("pageshow", function () {
                hideScreenLoader();
                document.querySelectorAll(".btn-loading").forEach(function (btn) {
                    btn.classList.remove("btn-loading");
                    btn.disabled = false;
                    const spinner = btn.querySelector(".btn-spinner");
                    if (spinner) spinner.remove();
                });
            });
        });
    </script>
</div>
</body>
</html>
