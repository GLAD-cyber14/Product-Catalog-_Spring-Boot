<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head th:fragment="header-fragment(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <meta name="cart-auth" content="1" sec:authorize="isAuthenticated()">

    <title th:text="${title}">Product Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/products.css}">

    <style>
        .loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #0d6efd;
            z-index: 99999;
            transition: width 0.3s ease-out, opacity 0.3s ease-in;
            opacity: 0;
        }
        .loading-bar.loading { opacity: 1; width: 75%; }
        .loading-bar.complete { width: 100%; opacity: 0; }

        body:not(.cart-ready) .cart-action-container { visibility: hidden; }
        .cart-action-container.cart-busy { pointer-events: none; cursor: progress; }

        #cart-badge {
            padding: 0.25em 0.5em;
            font-weight: 700;
            line-height: 1;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg modern-navbar" th:fragment="navbar">
    <div id="loading-bar" class="loading-bar"></div>

    <div class="container-fluid px-4">
        <a class="navbar-brand modern-brand" th:href="@{/}">
            <img th:src="@{/images/gladwin-logo.png}"
                 alt="Gladwin Premium Product Store"
                 class="gladwin-logo">
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="ms-auto d-flex gap-1 align-items-center flex-wrap justify-content-end">
                <a th:href="@{/}" class="nav-item-link">Home</a>
                <a th:href="@{/products}" class="nav-item-link">Products</a>

                <a th:href="@{/admin/orders}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📦 All Orders
                </a>

                <a th:href="@{/cart}" class="nav-item-link d-inline-flex align-items-center gap-2">
                    <span>🛒 Cart</span>
                    <span id="cart-badge" class="badge rounded-pill bg-danger" style="display: none; font-size: 0.65rem;">0</span>
                </a>

                <a th:href="@{/orders}"
                   class="nav-item-link"
                   sec:authorize="isAuthenticated()">
                    📦 My Orders
                </a>

                <a th:href="@{/admin/dashboard}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📊 Dashboard
                </a>

                <a th:href="@{/admin/category}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    Categories
                </a>

                <a th:href="@{/admin/users}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    User Management
                </a>

                <a th:href="@{/profile}" class="btn btn-light">👤 My Profile</a>

                <a th:href="@{/login}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Login
                </a>

                <a th:href="@{/register}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Register
                </a>

                <form th:action="@{/logout}"
                      method="post"
                      th:if="${#authorization.expression('isAuthenticated()')}"
                      style="display:inline;">
                    <button type="submit" class="nav-item-link">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: btn-spin 0.4s linear infinite;
            vertical-align: -2px;
            margin-right: 6px;
        }
        .btn-spinner-lg {
            width: 36px;
            height: 36px;
            border-width: 3px;
            border-color: #0d6efd;
            border-right-color: transparent;
            margin-right: 0;
        }
        @keyframes btn-spin {
            to { transform: rotate(360deg); }
        }
        .btn-loading {
            opacity: 0.85;
            cursor: not-allowed !important;
            pointer-events: none;
        }
        .product-add-btn {
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .quantity-stepper {
            width: 110px;
            max-width: 100%;
            display: inline-flex;
            flex-shrink: 0;
        }
        .quantity-stepper.d-none { display: none !important; }
        .quantity-stepper .btn {
            padding: 4px 8px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
        }
        .item-count-input {
            background-color: #fff !important;
            font-weight: 600;
            color: #059669;
            font-size: 13px;
            padding: 4px 2px;
        }
        #page-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: #0d6efd;
            z-index: 100000;
            opacity: 0;
            pointer-events: none;
        }
        /* =========================================================
   FIX PRODUCT CARD IMAGES (PREVENT OVERFLOW)
========================================================= */
        .product-card img,
        .card-img-top,
        .card img {
            width: 100%;
            height: 180px;             /* Fixed uniform height across all devices */
            object-fit: contain;       /* Keeps the full image inside bounds without stretching */
            background-color: #f9fafb; /* Soft backdrop for transparent images */
            padding: 10px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        /* Responsive adjustment for mobile and tablets */
        @media (max-width: 768px) {
            .product-card img,
            .card-img-top,
            .card img {
                height: 150px;         /* Slightly smaller box on smaller screens */
            }
        }
    </style>

    <script>
        let cartState = {};
        let cartQueue = Promise.resolve();
        let cartUiBooted = false;

        function getCartData() { return cartState; }
        function saveCartData(cart) { cartState = cart || {}; updateCartBadge(); }

        function isCartUser() {
            return !!document.querySelector('meta[name="cart-auth"]');
        }

        function csrfHeaders() {
            const headers = { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' };
            const token = document.querySelector('meta[name="_csrf"]');
            const header = document.querySelector('meta[name="_csrf_header"]');
            if (token && header) {
                headers[header.getAttribute('content')] = token.getAttribute('content');
            }
            return headers;
        }

        async function cartFetch(method, url) {
            const res = await fetch(url, {
                method: method,
                headers: csrfHeaders(),
                credentials: 'same-origin'
            });
            if (res.redirected) {
                window.location.href = res.url;
                return null;
            }
            let data = null;
            try { data = await res.json(); } catch (e) { /* no JSON body */ }
            if (!res.ok) {
                const err = new Error(method + " " + url + " -> " + res.status);
                err.data = data;
                throw err;
            }
            return data;
        }

        function updateCartBadge() {
            let total = 0;
            Object.keys(cartState).forEach(function (k) {
                total += parseInt(cartState[k], 10) || 0;
            });
            const badge = document.getElementById("cart-badge");
            if (!badge) return;
            if (total > 0) {
                badge.style.display = "inline-block";
                badge.textContent = total;
            } else {
                badge.style.display = "none";
                badge.textContent = "0";
            }
        }

        const ADD_BTN_SELECTOR = ".add-product-btn, .product-add-btn";

        function qtyForProduct(productId) {
            if (productId == null || productId === "") return 0;
            const key = String(productId);
            const raw = cartState[key] != null ? cartState[key] : cartState[productId];
            return parseInt(raw, 10) || 0;
        }

        function showStepper(container, qty) {
            const addBtn = container.querySelector(ADD_BTN_SELECTOR);
            const stepper = container.querySelector(".quantity-stepper");
            const input = container.querySelector(".item-count-input");
            if (addBtn) addBtn.classList.add("d-none");
            if (stepper) stepper.classList.remove("d-none");
            if (input) input.value = qty;
        }
        function showAddButton(container) {
            const addBtn = container.querySelector(ADD_BTN_SELECTOR);
            const stepper = container.querySelector(".quantity-stepper");
            const input = container.querySelector(".item-count-input");

            // Products page: keep - / count / + visible even at quantity 0
            if (container.classList.contains("always-show-stepper")) {
                if (addBtn) addBtn.classList.add("d-none");
                if (stepper) stepper.classList.remove("d-none");
                if (input) input.value = 0;
                return;
            }

            if (addBtn) addBtn.classList.remove("d-none");
            if (stepper) stepper.classList.add("d-none");
        }

        function renderCartCards() {
            document.querySelectorAll(".cart-action-container").forEach(function (container) {
                const qty = qtyForProduct(container.getAttribute("data-product-id"));
                if (qty > 0) {
                    showStepper(container, qty);
                } else {
                    showAddButton(container);
                }
            });
            updateCartBadge();
        }

        async function loadCartState() {
            try {
                const res = await fetch('/cart/state', {
                    headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'same-origin'
                });
                if (res.ok && !res.redirected) {
                    const data = await res.json();
                    cartState = data.items || {};
                }
            } catch (e) {
                console.error("Could not load cart:", e);
            }
            renderCartCards();
            document.body.classList.add("cart-ready");
        }

        function changeCart(button, action) {
            const container = button.closest(".cart-action-container");
            if (!container || container.dataset.busy === "1") return Promise.resolve();

            const productId = container.getAttribute("data-product-id");
            const stock = parseInt(container.getAttribute("data-stock"), 10) || 0;

            container.dataset.busy = "1";
            container.classList.add("cart-busy");

            const originalHtml = button.innerHTML;
            const spinner = document.createElement("span");
            spinner.className = "btn-spinner";
            if (button.matches(ADD_BTN_SELECTOR)) {
                button.prepend(spinner);
            } else {
                spinner.style.marginRight = "0";
                button.innerHTML = "";
                button.appendChild(spinner);
            }

            cartQueue = cartQueue.then(async function () {
                try {
                    const data = await cartFetch('POST', '/cart/' + action + '/' + productId);
                    if (data) {
                        cartState = data.items || {};
                        renderCartCards();
                        if (data.limitReached) {
                            alert("⚠️ Stock limit reached! Only " + stock + " items available.");
                        }
                    }
                } catch (e) {
                    console.error("Cart update failed:", e);
                    if (e.data && e.data.error === "outofstock") {
                        alert("Sorry, this item is out of stock.");
                    } else {
                        alert("Couldn't update your cart. Please try again.");
                    }
                    await loadCartState();
                } finally {
                    button.innerHTML = originalHtml;
                    delete container.dataset.busy;
                    container.classList.remove("cart-busy");
                }
            });

            return cartQueue;
        }

        function incrementCartItem(button) { return changeCart(button, 'add'); }
        function decrementCartItem(button) { return changeCart(button, 'decrease-product'); }

        function bootCartUi() {
            if (cartUiBooted) return;
            cartUiBooted = true;

            try { localStorage.removeItem("gladwin_cart"); } catch (e) { /* ignore */ }

            if (isCartUser()) {
                loadCartState();
            } else {
                renderCartCards();
                document.body.classList.add("cart-ready");
            }

            let navBar = document.getElementById("page-progress");
            if (!navBar) {
                navBar = document.createElement("div");
                navBar.id = "page-progress";
                document.body.appendChild(navBar);
            }
            let resetTimer = null;

            function startProgressBar() {
                navBar.style.transition = "none";
                navBar.style.width = "0%";
                navBar.style.opacity = "1";
                void navBar.offsetWidth;
                navBar.style.transition = "width 8s cubic-bezier(0.1, 0.8, 0.2, 1)";
                navBar.style.width = "85%";
                clearTimeout(resetTimer);
                resetTimer = setTimeout(resetLoadingFeedback, 15000);
            }

            function addInlineSpinner(el) {
                if (!el || el.classList.contains("btn-loading")) return;
                if (el.tagName !== "INPUT" && !el.querySelector(".inline-spinner")) {
                    const sp = document.createElement("span");
                    sp.className = "btn-spinner inline-spinner";
                    el.prepend(sp);
                }
                el.classList.add("btn-loading");
            }

            function resetLoadingFeedback() {
                clearTimeout(resetTimer);
                navBar.style.transition = "none";
                navBar.style.width = "0%";
                navBar.style.opacity = "0";
                document.querySelectorAll(".inline-spinner").forEach(function (el) { el.remove(); });
                document.querySelectorAll(".btn-loading").forEach(function (el) {
                    el.classList.remove("btn-loading");
                });
            }

            document.addEventListener("submit", function (e) {
                const form = e.target;
                if (!form || form.classList.contains("no-loader")) return;
                const btn = e.submitter || form.querySelector('button[type="submit"], input[type="submit"]');
                if (btn && !btn.classList.contains("no-spinner") && !btn.classList.contains("no-loader")) {
                    addInlineSpinner(btn);
                }
                startProgressBar();
            });

            document.addEventListener("click", function (e) {
                const link = e.target.closest("a");
                if (!link) return;
                const href = link.getAttribute("href");
                if (!href || href.startsWith("#") || href.startsWith("javascript") || link.target === "_blank") return;
                if (link.protocol !== "http:" && link.protocol !== "https:") return;
                if (link.hostname && link.hostname !== window.location.hostname) return;
                if (link.hasAttribute("data-bs-toggle") || link.hasAttribute("download")) return;
                if (link.classList.contains("no-loader")) return;
                if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
                startProgressBar();
                if (!link.querySelector("img") && link.textContent.trim().length <= 40) {
                    addInlineSpinner(link);
                }
            });

            document.addEventListener("visibilitychange", function () {
                if (!document.hidden && isCartUser()) loadCartState();
            });

            window.addEventListener("pageshow", function (e) {
                resetLoadingFeedback();
                if (e.persisted && isCartUser()) loadCartState();
            });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", bootCartUi);
        } else {
            bootCartUi();
        }
    </script>
</div>
</body>
</html>
