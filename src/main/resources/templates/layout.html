<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en">
<!-- Fragment 1: The Shared Header (Includes Bootstrap CDN) -->
<head th:fragment="header-fragment(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">Product Catalog</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Product Page CSS -->
    <link rel="stylesheet" th:href="@{/css/products.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg modern-navbar" th:fragment="navbar">

    <div class="container-fluid px-4">

        <!-- Brand -->
        <a class="navbar-brand modern-brand" th:href="@{/}">
            <img th:src="@{/images/gladwin-logo.png}"
                  alt="Gladwin Premium Product Store"
                  class="gladwin-logo">
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="mainNavbar">

            <div class="ms-auto d-flex gap-2 align-items-center">

                <a th:href="@{/}" class="nav-item-link">Home</a>

                <a th:href="@{/products}" class="nav-item-link">Products</a>
                <!-- Admin Orders -->
                <a th:href="@{/admin/orders}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📦 All Orders
                </a>

                <a th:href="@{/cart}" class="nav-item-link">
                    🛒 Cart
                </a>
                <!-- My Orders - Only when logged in -->

                <a th:href="@{/orders}"
                   class="nav-item-link"
                   sec:authorize="isAuthenticated()">
                    📦 My Orders </a>

                <a th:href="@{/admin/dashboard}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📊 Dashboard
                </a>


                <a th:href="@{/admin/category}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    Categories
                </a>

                <a th:href="@{/admin/users}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    User Management
                </a>

                <a th:href="@{/profile}" class="btn btn-light">
                    👤 My Profile
                </a>



                <!-- Login - Only when NOT logged in -->
                <a th:href="@{/login}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Login
                </a>

                <!-- Register - Only when NOT logged in -->
                <a th:href="@{/register}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Register
                </a>

                <!-- Logout - Only when logged in -->
                <form th:action="@{/logout}"
                      method="post"
                      th:if="${#authorization.expression('isAuthenticated()')}"
                      style="display:inline;">

                    <button type="submit"
                            class="nav-item-link">
                        Logout
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<!-- Fragment 3: Shared JavaScript Dependencies -->
<div th:fragment="scripts">
    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
