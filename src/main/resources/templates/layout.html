<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en">
<!-- Fragment 1: The Shared Header (Includes Bootstrap CDN & Loading Bar Styles) -->
<head th:fragment="header-fragment(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">Product Catalog</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Product Page CSS -->
    <link rel="stylesheet" th:href="@{/css/products.css}">

    <!-- Top Loading Bar Styles -->
    <style>
        .loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #0d6efd; /* Matches your clean theme */
            z-index: 99999;
            transition: width 0.3s ease-out, opacity 0.3s ease-in;
            opacity: 0;
        }
        .loading-bar.loading {
            opacity: 1;
            width: 75%;
        }
        .loading-bar.complete {
            width: 100%;
            opacity: 0;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg modern-navbar" th:fragment="navbar">

    <!-- Top Loading Progress Bar Element -->
    <div id="loading-bar" class="loading-bar"></div>

    <div class="container-fluid px-4">

        <!-- Brand -->
        <a class="navbar-brand modern-brand" th:href="@{/}">
            <img th:src="@{/images/gladwin-logo.png}"
                 alt="Gladwin Premium Product Store"
                 class="gladwin-logo">
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="mainNavbar">

            <div class="ms-auto d-flex gap-2 align-items-center">

                <a th:href="@{/}" class="nav-item-link">Home</a>

                <a th:href="@{/products}" class="nav-item-link">Products</a>
                <!-- Admin Orders -->
                <a th:href="@{/admin/orders}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📦 All Orders
                </a>

                <a th:href="@{/cart}" class="nav-item-link">
                    🛒 Cart
                </a>
                <!-- My Orders - Only when logged in -->

                <a th:href="@{/orders}"
                   class="nav-item-link"
                   sec:authorize="isAuthenticated()">
                    📦 My Orders </a>

                <a th:href="@{/admin/dashboard}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📊 Dashboard
                </a>


                <a th:href="@{/admin/category}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    Categories
                </a>

                <a th:href="@{/admin/users}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    User Management
                </a>

                <a th:href="@{/profile}" class="btn btn-light">
                    👤 My Profile
                </a>



                <!-- Login - Only when NOT logged in -->
                <a th:href="@{/login}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Login
                </a>

                <!-- Register - Only when NOT logged in -->
                <a th:href="@{/register}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Register
                </a>

                <!-- Logout - Only when logged in -->
                <form th:action="@{/logout}"
                      method="post"
                      th:if="${#authorization.expression('isAuthenticated()')}"
                      style="display:inline;">

                    <button type="submit"
                            class="nav-item-link">
                        Logout
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<!-- Fragment 3: Shared JavaScript Dependencies & Loading Bar Trigger Script -->
<div th:fragment="scripts">
    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Universal Circular Loading Overlay Script (Links + Forms + All Buttons) -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 1. Auto-inject the loading modal overlay if missing
            let loadingOverlay = document.getElementById("circular-loading-overlay");
            if (!loadingOverlay) {
                loadingOverlay = document.createElement("div");
                loadingOverlay.id = "circular-loading-overlay";
                loadingOverlay.innerHTML = `
                    <div class="circular-loader-wrapper">
                        <div class="dot-spinner">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                        <div class="loading-text">loading...</div>
                    </div>
                `;
                document.body.appendChild(loadingOverlay);
            }

            // 2. Auto-inject styles
            if (!document.getElementById("circular-loader-styles")) {
                const style = document.createElement("style");
                style.id = "circular-loader-styles";
                style.innerHTML = `
                    #circular-loading-overlay {
                        position: fixed !important;
                        top: 0 !important;
                        left: 0 !important;
                        width: 100vw !important;
                        height: 100vh !important;
                        background: rgba(255, 255, 255, 0.9) !important;
                        backdrop-filter: blur(3px);
                        display: flex !important;
                        justify-content: center !important;
                        align-items: center !important;
                        z-index: 2147483647 !important;
                        opacity: 0 !important;
                        pointer-events: none !important;
                        transition: opacity 0.25s ease-in-out !important;
                    }

                    #circular-loading-overlay.active {
                        opacity: 1 !important;
                        pointer-events: auto !important;
                    }

                    .circular-loader-wrapper {
                        position: relative;
                        width: 160px;
                        height: 160px;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                    }

                    .dot-spinner {
                        position: absolute;
                        width: 100%;
                        height: 100%;
                        animation: spinnerRotate 1.2s linear infinite;
                    }

                    .dot-spinner .dot {
                        position: absolute;
                        top: 50%;
                        left: 50%;
                        width: 12px;
                        height: 12px;
                        margin: -6px 0 0 -6px;
                        background-color: #333;
                        border-radius: 50%;
                    }

                    .dot-spinner .dot:nth-child(1)  { transform: rotate(0deg) translate(55px); opacity: 1.0; }
                    .dot-spinner .dot:nth-child(2)  { transform: rotate(30deg) translate(55px); opacity: 0.9; }
                    .dot-spinner .dot:nth-child(3)  { transform: rotate(60deg) translate(55px); opacity: 0.8; }
                    .dot-spinner .dot:nth-child(4)  { transform: rotate(90deg) translate(55px); opacity: 0.7; }
                    .dot-spinner .dot:nth-child(5)  { transform: rotate(120deg) translate(55px); opacity: 0.6; }
                    .dot-spinner .dot:nth-child(6)  { transform: rotate(150deg) translate(55px); opacity: 0.5; }
                    .dot-spinner .dot:nth-child(7)  { transform: rotate(180deg) translate(55px); opacity: 0.4; }
                    .dot-spinner .dot:nth-child(8)  { transform: rotate(210deg) translate(55px); opacity: 0.3; }
                    .dot-spinner .dot:nth-child(9)  { transform: rotate(240deg) translate(55px); opacity: 0.25; }
                    .dot-spinner .dot:nth-child(10) { transform: rotate(270deg) translate(55px); opacity: 0.2; }
                    .dot-spinner .dot:nth-child(11) { transform: rotate(300deg) translate(55px); opacity: 0.15; }
                    .dot-spinner .dot:nth-child(12) { transform: rotate(330deg) translate(55px); opacity: 0.1; }

                    @keyframes spinnerRotate {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }

                    .loading-text {
                        position: absolute;
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                        font-size: 15px;
                        font-weight: 600;
                        letter-spacing: 1px;
                        color: #222;
                        text-align: center;
                    }
                `;
                document.head.appendChild(style);
            }

            function startLoading() {
                loadingOverlay.classList.add("active");
            }

            function stopLoading() {
                loadingOverlay.classList.remove("active");
            }

            // 1. Trigger when clicking internal navigation links
            document.addEventListener("click", function (e) {
                const link = e.target.closest("a");
                if (link && link.href &&
                    link.getAttribute("href") !== "#" &&
                    !link.getAttribute("href").startsWith("javascript") &&
                    link.target !== "_blank" &&
                    link.hostname === window.location.hostname) {
                    startLoading();
                    return;
                }

                // 2. Trigger when clicking interactive buttons (excluding modal/dropdown UI toggles)
                const button = e.target.closest("button");
                if (button) {
                    // Ignore UI-only toggles that don't fetch server data
                    const isToggle = button.hasAttribute("data-bs-toggle") ||
                        button.getAttribute("data-bs-dismiss") === "modal" ||
                        button.classList.contains("navbar-toggler");
                    if (!isToggle) {
                        startLoading();
                    }
                }
            });

            // 3. Trigger on form submissions
            document.addEventListener("submit", function (e) {
                startLoading();
            });

            // 4. Hide overlay when page rendering/display completes
            window.addEventListener("pageshow", function () {
                stopLoading();
            });
        });
    </script>
</div>
</body>
</html>
