<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en">
<!-- Fragment 1: The Shared Header (Includes Bootstrap CDN & Loading Bar Styles) -->
<head th:fragment="header-fragment(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">Product Catalog</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Product Page CSS -->
    <link rel="stylesheet" th:href="@{/css/products.css}">

    <!-- Top Loading Bar Styles -->
    <style>
        .loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #0d6efd; /* Matches your clean theme */
            z-index: 99999;
            transition: width 0.3s ease-out, opacity 0.3s ease-in;
            opacity: 0;
        }
        .loading-bar.loading {
            opacity: 1;
            width: 75%;
        }
        .loading-bar.complete {
            width: 100%;
            opacity: 0;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg modern-navbar" th:fragment="navbar">

    <!-- Top Loading Progress Bar Element -->
    <div id="loading-bar" class="loading-bar"></div>

    <div class="container-fluid px-4">

        <!-- Brand -->
        <a class="navbar-brand modern-brand" th:href="@{/}">
            <img th:src="@{/images/gladwin-logo.png}"
                 alt="Gladwin Premium Product Store"
                 class="gladwin-logo">
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="mainNavbar">

            <div class="ms-auto d-flex gap-2 align-items-center">

                <a th:href="@{/}" class="nav-item-link">Home</a>

                <a th:href="@{/products}" class="nav-item-link">Products</a>
                <!-- Admin Orders -->
                <a th:href="@{/admin/orders}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📦 All Orders
                </a>

                <a th:href="@{/cart}" class="nav-item-link">
                    🛒 Cart
                </a>
                <!-- My Orders - Only when logged in -->

                <a th:href="@{/orders}"
                   class="nav-item-link"
                   sec:authorize="isAuthenticated()">
                    📦 My Orders </a>

                <a th:href="@{/admin/dashboard}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    📊 Dashboard
                </a>


                <a th:href="@{/admin/category}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    Categories
                </a>

                <a th:href="@{/admin/users}"
                   class="nav-item-link"
                   sec:authorize="hasRole('ADMIN')">
                    User Management
                </a>

                <a th:href="@{/profile}" class="btn btn-light">
                    👤 My Profile
                </a>



                <!-- Login - Only when NOT logged in -->
                <a th:href="@{/login}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Login
                </a>

                <!-- Register - Only when NOT logged in -->
                <a th:href="@{/register}"
                   class="nav-item-link"
                   th:if="${!#authorization.expression('isAuthenticated()')}">
                    Register
                </a>

                <!-- Logout - Only when logged in -->
                <form th:action="@{/logout}"
                      method="post"
                      th:if="${#authorization.expression('isAuthenticated()')}"
                      style="display:inline;">

                    <button type="submit"
                            class="nav-item-link">
                        Logout
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<!-- Fragment 3: Shared JavaScript Dependencies & Loading Bar Trigger Script -->
<div th:fragment="scripts">
    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Retro Block-Style Loading Overlay Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 1. Auto-inject the loading modal/overlay element if missing
            let loadingOverlay = document.getElementById("retro-loading-overlay");
            if (!loadingOverlay) {
                loadingOverlay = document.createElement("div");
                loadingOverlay.id = "retro-loading-overlay";
                loadingOverlay.innerHTML = `
                    <div class="retro-loader-box">
                        <div class="retro-loading-text">LOADING...</div>
                        <div class="retro-progress-bar">
                            <div class="retro-fill"></div>
                        </div>
                    </div>
                `;
                document.body.appendChild(loadingOverlay);
            }

            // 2. Auto-inject the exact retro block styles matching your reference image
            if (!document.getElementById("retro-loader-styles")) {
                const style = document.createElement("style");
                style.id = "retro-loader-styles";
                style.innerHTML = `
                    #retro-loading-overlay {
                        position: fixed !important;
                        top: 0 !important;
                        left: 0 !important;
                        width: 100vw !important;
                        height: 100vh !important;
                        background: rgba(255, 255, 255, 0.85) !important;
                        backdrop-filter: blur(2px);
                        display: flex !important;
                        justify-content: center !important;
                        align-items: center !important;
                        z-index: 2147483647 !important;
                        opacity: 0 !important;
                        pointer-events: none !important;
                        transition: opacity 0.2s ease-in-out !important;
                    }

                    #retro-loading-overlay.active {
                        opacity: 1 !important;
                        pointer-events: auto !important;
                    }

                    .retro-loader-box {
                        text-align: center;
                        font-family: 'Courier New', Courier, monospace;
                    }

                    .retro-loading-text {
                        font-size: 22px;
                        font-weight: bold;
                        letter-spacing: 3px;
                        color: #000;
                        margin-bottom: 12px;
                    }

                    .retro-progress-bar {
                        width: 260px;
                        height: 28px;
                        border: 3px solid #000;
                        padding: 3px;
                        background: #fff;
                        box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
                        overflow: hidden;
                    }

                    .retro-fill {
                        height: 100%;
                        width: 0%;
                        background: repeating-linear-gradient(
                            90deg,
                            #000,
                            #000 12px,
                            #fff 12px,
                            #fff 16px
                        );
                        animation: retroFillAnim 1.2s infinite steps(10);
                    }

                    @keyframes retroFillAnim {
                        0% { width: 0%; }
                        100% { width: 100%; }
                    }
                `;
                document.head.appendChild(style);
            }

            function startLoading() {
                loadingOverlay.classList.add("active");
            }

            function stopLoading() {
                loadingOverlay.classList.remove("active");
            }

            // Trigger when clicking internal links
            document.addEventListener("click", function (e) {
                const link = e.target.closest("a");
                if (link && link.href &&
                    link.getAttribute("href") !== "#" &&
                    !link.getAttribute("href").startsWith("javascript") &&
                    link.target !== "_blank" &&
                    link.hostname === window.location.hostname) {
                    startLoading();
                }
            });

            // Trigger on form submissions
            document.addEventListener("submit", function (e) {
                startLoading();
            });

            // Stop when page displays
            window.addEventListener("pageshow", function () {
                stopLoading();
            });
        });
    </script>
</div>

</body>
</html>
