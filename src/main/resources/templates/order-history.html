<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: header-fragment('My Orders | Gladwin Product Suite')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Gladwin Product Suite</title>
</head>

<body class="bg-light">

<!-- ================= NAVBAR ================= -->
<div th:replace="~{layout :: navbar}"></div>

<div class="container py-4" style="max-width: 1100px; margin: auto;">

    <div class="header mb-4">
        <h1>My Orders</h1>
    </div>

    <!-- Filter Criteria Bar -->
    <div class="filter-bar bg-white p-3 rounded shadow-sm mb-4 d-flex gap-2 flex-wrap align-items-center">
        <span style="font-weight: bold; margin-right: 5px;">Filter:</span>
        <a th:href="@{/orders(filter='recent10', size=10)}"
           class="btn btn-outline-primary btn-sm"
           th:classappend="${currentFilter == 'recent10' ? 'active' : ''}">Recent 10 Orders</a>

        <a th:href="@{/orders(filter='week', size=10)}"
           class="btn btn-outline-primary btn-sm"
           th:classappend="${currentFilter == 'week' ? 'active' : ''}">Last Week</a>

        <a th:href="@{/orders(filter='month', size=10)}"
           class="btn btn-outline-primary btn-sm"
           th:classappend="${currentFilter == 'month' ? 'active' : ''}">Last Month</a>

        <a th:href="@{/orders(filter='year', size=10)}"
           class="btn btn-outline-primary btn-sm"
           th:classappend="${currentFilter == 'year' ? 'active' : ''}">This Year</a>

        <a th:href="@{/orders(filter='all', size=10)}"
           class="btn btn-outline-primary btn-sm"
           th:classappend="${currentFilter == 'all' ? 'active' : ''}">All Orders</a>
    </div>

    <!-- Display this when the customer has no orders -->
    <div class="empty text-center bg-white p-5 rounded shadow-sm" th:if="${#lists.isEmpty(orders)}">
        <h2>No orders found</h2>
        <p class="text-muted mb-4">No orders match your selected criteria.</p>
        <a class="btn btn-primary" th:href="@{/products}">Start Shopping</a>
    </div>

    <!-- Display each order -->
    <div th:each="order : ${orders}" class="order-card bg-white p-4 mb-3 rounded shadow-sm">

        <div class="order-heading d-flex justify-content-between align-items-center flex-wrap gap-2 border-bottom pb-3 mb-3">
            <h2 class="h5 mb-0">
                Order #
                <span th:text="${order.id}">1001</span>
            </h2>

            <span class="badge bg-success text-white px-3 py-2 rounded-pill"
                  th:text="${order.orderStatus}">PLACED</span>
        </div>

        <div class="order-details" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px;">

            <div>
                <span class="text-muted small d-block mb-1">Order Date</span>
                <span class="fw-bold"
                      th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'dd MMM yyyy, hh:mm a') : 'Not available'}">
                    21 Oct 2026
                </span>
            </div>

            <div>
                <span class="text-muted small d-block mb-1">Total Amount</span>
                <span class="fw-bold">
                    ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">500.00</span>
                </span>
            </div>

            <div>
                <span class="text-muted small d-block mb-1">Payment Method</span>
                <span class="fw-bold"
                      th:text="${order.paymentMethod}">COD</span>
            </div>

            <div>
                <span class="text-muted small d-block mb-1">Payment Status</span>
                <span class="fw-bold"
                      th:text="${order.paymentStatus}">PENDING</span>
            </div>

        </div>

        <a class="btn btn-primary btn-sm mt-3"
           th:href="@{/orders/{id}(id=${order.id})}">
            View Details →
        </a>

    </div>

    <!-- Pagination Controls -->
    <div class="pagination d-flex justify-content-center gap-2 mt-4 align-items-center" th:if="${totalPages > 1}">
        <a class="page-link btn btn-outline-primary"
           th:classappend="${currentPage == 0 ? 'disabled' : ''}"
           th:href="@{/orders(page=${currentPage - 1}, filter=${currentFilter})}">
            ← Previous
        </a>

        <span class="fw-bold px-2"
              th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}">
        </span>

        <a class="page-link btn btn-outline-primary"
           th:classappend="${currentPage + 1 >= totalPages ? 'disabled' : ''}"
           th:href="@{/orders(page=${currentPage + 1}, filter=${currentFilter})}">
            Next →
        </a>
    </div>

</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
