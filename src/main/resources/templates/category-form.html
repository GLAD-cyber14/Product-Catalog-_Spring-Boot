<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Category Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{layout :: navbar}"></div>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <!-- TITLE -->

                    <h2 class="fw-bold mb-4"
                        th:text="${category.categoryid == 0
                                  ? 'Add Category'
                                  : 'Edit Category'}">

                        Add Category

                    </h2>


                    <!-- FORM -->

                    <form th:action="@{/admin/category/save}"
                          th:object="${category}"
                          method="post">


                        <!-- CATEGORY NAME -->

                        <div class="mb-4">

                            <label for="categoryname"
                                   class="form-label fw-bold">

                                Category Name

                            </label>

                            <input type="text"
                                   id="categoryname"
                                   th:field="*{categoryname}"
                                   class="form-control"
                                   placeholder="Enter category name"
                                   required>

                        </div>

                        <!-- PARENT CATEGORY -->

                        <div class="mb-4">

                            <label for="parent"
                                   class="form-label fw-bold">

                                Parent Category

                            </label>

                            <select id="parent"
                                    name="parent"
                                    class="form-select">

                                <option value="">
                                    No Parent (Main Category)
                                </option>

                                <option th:each="main : ${mainCategories}"
                                        th:value="${main.categoryid}"
                                        th:text="${main.categoryname}"
                                        th:selected="${category.parent != null
                              and category.parent.categoryid == main.categoryid}">
                                </option>

                            </select>

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">

                                💾 Save Category

                            </button>


                            <a th:href="@{/admin/category}"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
