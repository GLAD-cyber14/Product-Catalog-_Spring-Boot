<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Gladwin Product Suite</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #263238;
        }

        .profile-container {
            max-width: 650px;
            margin: 20px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 25px;
        }

        .profile-picture {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-picture img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e0e7ff;
            background: #f3f4f6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            text-align: center;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn {
            background: #4f46e5;
            color: white;
        }

        .back-btn {
            background: #e5e7eb;
            color: #263238;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .hint {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .profile-container {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="profile-container">

    <h1>👤 My Profile</h1>
    <p class="subtitle">Manage your personal information</p>

    <div th:if="${successMessage}"
         class="message success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="message error"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/profile/update}"
          method="post"
          enctype="multipart/form-data">

        <div class="profile-picture">

            <img id="profilePreview"
                 th:src="${user.profileImage != null and !user.profileImage.isEmpty()
                     ? user.profileImage
                     : 'https://placehold.co/130x130?text=Profile'}"
                 alt="Profile Picture">

            <div class="form-group" style="margin-top: 15px;">
                <label for="profileImage">Change Profile Picture</label>

                <input type="file"
                       id="profileImage"
                       name="profileImage"
                       accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp,.heic,.svg">

                <small class="hint">
                    Choose an image to upload to your profile.
                </small>
            </div>

        </div>

        <div class="form-group">
            <label for="username">Username</label>

            <input type="text"
                   id="username"
                   th:value="${user.username}"
                   readonly>
        </div>

        <!-- EMAIL ADDRESS SECTION FOR INVOICES & NOTIFICATIONS -->
        <div class="form-group">
            <label for="email">Email Address</label>

            <input type="email"
                   id="email"
                   name="email"
                   th:value="${user.email}"
                   placeholder="e.g. user@example.com"
                   required>

            <small class="hint">
                Order receipts, invoices, and refund updates will be sent to this email.
            </small>
        </div>

        <div class="form-group">
            <label for="firstName">First Name</label>

            <input type="text"
                   id="firstName"
                   name="firstName"
                   th:value="${user.firstName}"
                   required>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>

            <input type="text"
                   id="lastName"
                   name="lastName"
                   th:value="${user.lastName}"
                   required>
        </div>

        <div class="buttons">
            <button type="submit" class="btn save-btn">
                Save Changes
            </button>

            <a th:href="@{/}" class="btn back-btn">
                Back to Home
            </a>
        </div>

    </form>

</div>

<script>
    document.getElementById('profileImage').addEventListener('change', function (event) {
        const file = event.target.files[0];

        if (file && (file.type.startsWith('image/')||file.type==='')) {
            document.getElementById('profilePreview').src =
                URL.createObjectURL(file);
        }
    });
</script>

</body>
</html>
