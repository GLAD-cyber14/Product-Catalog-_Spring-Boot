<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>


<body class="bg-light">


<!-- NAVBAR -->

<div th:replace="~{layout :: navbar}"></div>


<div class="container py-5">


    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <div>

            <h1 class="fw-bold mb-1">
                User Management
            </h1>

            <p class="text-muted mb-0">
                Manage registered users
            </p>

        </div>


        <!-- CREATE USER -->

        <a th:href="@{/admin/users/create}"
           class="btn btn-primary">

            + Create User

        </a>

    </div>



    <!-- ===================================================== -->
    <!-- SUCCESS MESSAGE -->
    <!-- ===================================================== -->

    <div th:if="${successMessage}"
         class="alert alert-success">

        <span th:text="${successMessage}">
            Success
        </span>

    </div>



    <!-- ===================================================== -->
    <!-- ERROR MESSAGE -->
    <!-- ===================================================== -->

    <div th:if="${errorMessage}"
         class="alert alert-danger">

        <span th:text="${errorMessage}">
            Error
        </span>

    </div>



    <!-- ===================================================== -->
    <!-- USER TABLE -->
    <!-- ===================================================== -->

    <div class="card shadow-sm border-0">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover
                              align-middle mb-0">


                    <!-- ================================================= -->
                    <!-- TABLE HEADER -->
                    <!-- ================================================= -->

                    <thead class="table-dark">

                    <tr>

                        <th>Photo</th>

                        <th>ID</th>

                        <th>Full Name</th>

                        <th>Username</th>

                        <th>Role</th>

                        <th>Actions</th>

                    </tr>

                    </thead>



                    <!-- ================================================= -->
                    <!-- USER ROWS -->
                    <!-- ================================================= -->

                    <tbody>

                    <tr th:each="user : ${users}">


                        <!-- ============================================= -->
                        <!-- PROFILE IMAGE -->
                        <!-- ============================================= -->

                        <td>

                            <div th:if="${user.profileImage != null
                                         and !user.profileImage.isEmpty()}">

                                <img th:src="@{${user.profileImage}}"

                                     th:alt="${user.firstName + ' ' + user.lastName}"

                                     style="
                                         width: 55px;
                                         height: 55px;
                                         object-fit: cover;
                                         border-radius: 50%;
                                         border: 2px solid #dee2e6;
                                     ">

                            </div>


                            <!-- NO PROFILE IMAGE -->

                            <div th:unless="${user.profileImage != null
                                              and !user.profileImage.isEmpty()}">

                                <div style="
                                    width: 55px;
                                    height: 55px;
                                    border-radius: 50%;
                                    background: #e9ecef;
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    font-size: 24px;
                                ">

                                    👤

                                </div>

                            </div>

                        </td>



                        <!-- ============================================= -->
                        <!-- ID -->
                        <!-- ============================================= -->

                        <td th:text="${user.id}">

                            1

                        </td>



                        <!-- ============================================= -->
                        <!-- FULL NAME -->
                        <!-- ============================================= -->

                        <td>

                            <strong
                                    th:text="${user.firstName + ' ' + user.lastName}">

                                Gladwin Solomon

                            </strong>

                        </td>



                        <!-- ============================================= -->
                        <!-- USERNAME -->
                        <!-- ============================================= -->

                        <td>

                            <span
                                    th:text="${user.username}">

                                gladwin321

                            </span>

                        </td>



                        <!-- ============================================= -->
                        <!-- ROLE -->
                        <!-- ============================================= -->

                        <td>

                            <span class="badge bg-primary"
                                  th:text="${user.role}">

                                USER

                            </span>

                        </td>



                        <!-- ============================================= -->
                        <!-- ACTIONS -->
                        <!-- ============================================= -->

                        <td>


                            <!-- EDIT -->

                            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"

                               class="btn btn-sm btn-outline-primary">

                                ✏️ Edit

                            </a>



                            <!-- DELETE -->

                            <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"

                               class="btn btn-sm btn-outline-danger"

                               onclick="return confirm(
                                   'Are you sure you want to delete this user?'
                               );">

                                🗑️ Delete

                            </a>


                        </td>


                    </tr>



                    <!-- ================================================= -->
                    <!-- NO USERS -->
                    <!-- ================================================= -->

                    <tr th:if="${#lists.isEmpty(users)}">

                        <td colspan="6"
                            class="text-center py-5 text-muted">

                            No registered users found.

                        </td>

                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>


</div>

<!-- Bootstrap JS -->
<div th:replace="~{layout :: scripts}"></div>
</body>

</html>
