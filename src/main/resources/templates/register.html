<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Register - Product Portal</title>

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">

</head>

<body>

<div class="auth-card">

    <!-- Logo -->
    <div class="logo">
        🛍️
    </div>

    <!-- Title -->
    <h2>Create Account</h2>

    <p class="subtitle">
        Join the Product Portal
    </p>


    <!-- Registration Form -->
    <form th:action="@{/register}"
          method="post">
        <div th:if="${error}" style="color: red; margin-bottom: 15px;">
            <span th:text="${error}"></span>
        </div>
        <!-- Username -->
        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Choose a username"
                   required>

        </div>


        <!-- Email -->
        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email address"
                   autocomplete="email"
                   required>

        </div>




        <!-- Password -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create a password"
                   required>

        </div>


        <!-- Register Button -->
        <button type="submit"
                class="auth-button">

            CREATE ACCOUNT

        </button>

    </form>


    <!-- Login Link -->
    <div class="auth-link">

        Already have an account?

        <a th:href="@{/login}">
            Login
        </a>

    </div>

</div>

</body>

</html>
