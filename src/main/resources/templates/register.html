<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <title>Register - Product Portal</title>

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">

    <style>
        /* Green Success Alert Style */
        .alert-success {
            color: #0f5132;
            background-color: #d1e7dd;
            border: 1px solid #badbcc;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Error Alert Style */
        .alert-danger {
            color: #842029;
            background-color: #f8d7da;
            border: 1px solid #f5c2c7;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Inline Spinner Animation */
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: -1px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-button.btn-loading {
            pointer-events: none;
            opacity: 0.8;
        }

        /* ===== Mobile: correct size + no zoom when tapping a field ===== */
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }

        /* Phones zoom into any field whose text is smaller than 16px, so keep it at 16px */
        .auth-card input,
        .auth-card select,
        .auth-card textarea {
            font-size: 16px !important;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 28px 20px;
                margin: 16px auto;
            }

            .auth-card input {
                padding: 14px 14px;
            }

            .auth-button {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>

</head>

<body>

<div class="auth-card">

    <!-- Logo -->
    <div class="logo">
        🛍️
    </div>

    <!-- Title -->
    <h2>Create Account</h2>

    <p class="subtitle">
        Join the Product Portal
    </p>


    <!-- Registration Form -->
    <form th:action="@{/register}"
          method="post"
          id="registerForm">

        <!-- Green Success Alert -->
        <div th:if="${successMessage}" class="alert-success">
            ✅ <span th:text="${successMessage}">Registered successfully!</span>
        </div>

        <!-- Red Error Alert -->
        <div th:if="${error}" class="alert-danger">
            ⚠️ <span th:text="${error}"></span>
        </div>

        <!-- Username -->
        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Choose a username"
                   required>

        </div>


        <!-- Email -->
        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email address"
                   autocomplete="email"
                   required>

        </div>


        <!-- Password -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create a password"
                   required>

        </div>


        <!-- Register Button with Loader -->
        <button type="submit"
                id="registerBtn"
                class="auth-button">

            CREATE ACCOUNT

        </button>

    </form>


    <!-- Login Link -->
    <div class="auth-link">

        Already have an account?

        <a th:href="@{/login}">
            Login
        </a>

    </div>

</div>

<!-- Global scripts (loading spinner, progress bar) -->
<div th:insert="~{layout :: scripts}"></div>

</body>

</html>
