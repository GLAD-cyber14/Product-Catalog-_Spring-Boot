<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Category Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/products.css}">

    <style>

        body {
            background: #f6f8fb;
            color: #212529;
        }

        .category-header {
            margin-bottom: 35px;
        }

        .category-header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .category-header p {
            font-size: 17px;
            color: #6c757d;
        }

        .add-category-btn {
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: 600;
        }

        .category-card {
            background: white;
            border: none;
            border-radius: 16px;
            margin-bottom: 18px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .main-category {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #edf0f3;
        }

        .category-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .category-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: #eef4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .category-name {
            font-size: 20px;
            font-weight: 700;
        }

        .category-type {
            font-size: 13px;
            color: #6c757d;
        }

        .category-actions {
            display: flex;
            gap: 8px;
        }

        .category-actions a {
            border-radius: 8px;
            padding: 7px 13px;
        }

        .subcategories {
            padding: 15px 30px 20px 83px;
            background: #fafbfc;
        }

        .subcategory {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid #edf0f3;
        }

        .subcategory:last-child {
            border-bottom: none;
        }

        .subcategory-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
        }

        .subcategory-arrow {
            color: #adb5bd;
            font-size: 18px;
        }

        .empty-state {
            background: white;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
        }

        .empty-state-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-state h4 {
            font-weight: 600;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{layout :: navbar}"></div>


<div class="container py-5">

    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center category-header">

        <div>

            <h1>
                Category Management
            </h1>

            <p>
                Organize your products using main categories and subcategories
            </p>

        </div>


        <!-- ADD CATEGORY -->

        <a th:href="@{/admin/category/create}"
           class="btn btn-primary add-category-btn">

            + Add Category

        </a>

    </div>


    <!-- EMPTY STATE -->

    <div th:if="${#lists.isEmpty(categories)}"
         class="empty-state">

        <div class="empty-state-icon">
            📁
        </div>

        <h4>
            No categories found
        </h4>

        <p class="text-muted">
            Create your first product category.
        </p>

        <a th:href="@{/admin/category/create}"
           class="btn btn-primary">

            + Add Category

        </a>

    </div>


    <!-- CATEGORY LIST -->

    <div th:unless="${#lists.isEmpty(categories)}">

        <!-- MAIN CATEGORIES -->

        <div th:each="main : ${categories}"
             th:if="${main.parent == null}"
             class="category-card">


            <!-- MAIN CATEGORY -->

            <div class="main-category">

                <div class="category-left">

                    <div class="category-icon">
                        📁
                    </div>

                    <div>

                        <div class="category-name"
                             th:text="${main.categoryname}">

                            Electronics

                        </div>

                        <div class="category-type">
                            Main Category
                        </div>

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="category-actions">

                    <a th:href="@{/admin/category/edit/{id}
                                      (id=${main.categoryid})}"
                       class="btn btn-outline-warning btn-sm">

                        ✏️ Edit

                    </a>


                    <a th:href="@{/admin/category/delete/{id}
                                      (id=${main.categoryid})}"
                       class="btn btn-outline-danger btn-sm"
                       onclick="return confirm(
                           'Are you sure you want to delete this category?'
                       );">

                        🗑️ Delete

                    </a>

                </div>

            </div>


            <!-- SUBCATEGORIES -->

            <div class="subcategories">

                <div th:each="sub : ${categories}"
                     th:if="${sub.parent != null
                             and sub.parent.categoryid == main.categoryid}"
                     class="subcategory">


                    <div class="subcategory-name">

                        <span class="subcategory-arrow">
                            ↳
                        </span>

                        <span th:text="${sub.categoryname}">
                            Laptops
                        </span>

                    </div>


                    <!-- SUBCATEGORY ACTIONS -->

                    <div class="category-actions">

                        <a th:href="@{/admin/category/edit/{id}
                                          (id=${sub.categoryid})}"
                           class="btn btn-outline-warning btn-sm">

                            ✏️ Edit

                        </a>


                        <a th:href="@{/admin/category/delete/{id}
                                          (id=${sub.categoryid})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm(
                               'Are you sure you want to delete this category?'
                           );">

                            🗑️ Delete

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
