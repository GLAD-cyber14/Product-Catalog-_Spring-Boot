<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create User</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<!-- Existing Navbar -->
<div th:replace="~{layout :: navbar}"></div>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow border-0">

                <div class="card-body p-4 p-md-5">

                    <h2 class="fw-bold mb-1">
                        Create User
                    </h2>

                    <p class="text-muted mb-4">
                        Create a new user account
                    </p>


                    <form method="post"
                          action="/admin/users/create"
                          enctype="multipart/form-data">

                        <!-- First Name -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                First Name
                            </label>

                            <input type="text"
                                   name="firstName"
                                   class="form-control"
                                   placeholder="Enter first name"
                                   required>

                        </div>


                        <!-- Last Name -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Last Name
                            </label>

                            <input type="text"
                                   name="lastName"
                                   class="form-control"
                                   placeholder="Enter last name"
                                   required>

                        </div>


                        <!-- Username -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Username
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter username"
                                   required>

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter email address"
                                   required>

                        </div>




                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter password"
                                   required>

                        </div>


                        <!-- Role -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Role
                            </label>

                            <select name="role"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select role
                                </option>

                                <option value="USER">
                                    USER
                                </option>

                                <option value="ADMIN">
                                    ADMIN
                                </option>

                            </select>

                        </div>


                        <!-- Profile Image -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Profile Picture
                            </label>

                            <input type="file"
                                   name="profileImage"
                                   class="form-control"
                                   accept="image/*">

                            <div class="form-text">
                                Select an image for the user's profile picture.
                            </div>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">
                                Create User
                            </button>

                            <a th:href="@{/admin/users}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
