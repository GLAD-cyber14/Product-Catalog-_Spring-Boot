<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Order Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin-top: 35px;
            margin-bottom: 40px;
        }

        .page-header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .orders-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .table th {
            background: #eef2ff;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .status-form {
            display: flex;
            gap: 8px;
            min-width: 240px;
        }

        .status-form select {
            min-width: 135px;
        }

        .empty-message {
            text-align: center;
            padding: 35px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Page Header -->
    <div class="page-header">
        <h2>📦 Admin Order Management</h2>

        <p class="text-muted mb-3">
            View customer orders and manage their delivery status.
        </p>

        <a th:href="@{/}" class="btn btn-outline-primary">
            ← Back to Home
        </a>
    </div>

    <!-- Orders Table -->
    <div class="orders-card">

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Order Date</th>
                    <th>Total Amount</th>
                    <th>Payment Method</th>
                    <th>Payment Status</th>
                    <th>Order Status</th>
                    <th>Update Status</th>
                    <th>Details</th>
                    <th>Payment Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="order : ${orders}">

                    <td th:text="${order.id}"></td>

                    <td th:text="${order.customer != null
                                  ? order.customer.username
                                  : 'Unknown'}"></td>

                    <td th:text="${order.orderDate != null
                                  ? #temporals.format(order.orderDate, 'dd MMM yyyy, hh:mm a')
                                  : 'N/A'}"></td>

                    <td>
                        ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span>
                    </td>

                    <td th:text="${order.paymentMethod}"></td>

                    <td th:text="${order.paymentStatus}"></td>

                    <td>
                        <span class="badge bg-primary"
                              th:text="${order.orderStatus}">
                        </span>
                    </td>

                    <td>
                        <form th:action="@{/admin/orders/update-status}"
                              method="post"
                              class="status-form">


                            <input type="hidden"
                                   name="orderId"
                                   th:value="${order.id}">

                            <select name="status"
                                    class="form-select form-select-sm"
                                    required
                                    th:disabled="${order.orderStatus != null and (order.orderStatus.equalsIgnoreCase('DELIVERED') or order.orderStatus.equalsIgnoreCase('CANCELLED'))}">

                                <option value="PLACED"
                                        th:selected="${order.orderStatus == 'PLACED'}">
                                    Placed
                                </option>

                                <option value="PROCESSING"
                                        th:selected="${order.orderStatus == 'PROCESSING'}">
                                    Processing
                                </option>

                                <option value="SHIPPED"
                                        th:selected="${order.orderStatus == 'SHIPPED'}">
                                    Shipped
                                </option>

                                <option value="DELIVERED"
                                        th:selected="${order.orderStatus == 'DELIVERED'}">
                                    Delivered
                                </option>

                                <option value="CANCELLED"
                                        th:selected="${order.orderStatus == 'CANCELLED'}">
                                    Cancelled
                                </option>

                            </select>

                            <button type="submit"
                                    class="btn btn-success btn-sm"
                                    th:disabled="${order.orderStatus != null and (order.orderStatus.equalsIgnoreCase('DELIVERED') or order.orderStatus.equalsIgnoreCase('CANCELLED'))}">
                                Save
                            </button>

                        </form>

                        <span th:if="${order.orderStatus != null and (order.orderStatus.equalsIgnoreCase('DELIVERED') or order.orderStatus.equalsIgnoreCase('CANCELLED'))}"
                              class="badge bg-secondary mt-2">
    🔒 Order Locked
</span>


                    </td>


                    <td>
                        <a th:href="@{/orders/{id}(id=${order.id})}"
                           class="btn btn-outline-primary btn-sm">
                            View
                        </a>
                    </td>
                    <td>
                        <form th:if="${order.paymentMethod != null
                  and order.paymentMethod.equalsIgnoreCase('COD')
                  and order.paymentStatus != null
                  and !order.paymentStatus.equalsIgnoreCase('PAID')
                  and order.orderStatus != null
                  and !order.orderStatus.equalsIgnoreCase('CANCELLED')}"
                              th:action="@{/admin/orders/mark-paid}"
                              method="post"
                              onsubmit="return confirm('Confirm that you have received the cash payment?');">

                            <input type="hidden"
                                   name="orderId"
                                   th:value="${order.id}">

                            <button type="submit" class="btn btn-success btn-sm">
                                ✓ Mark as Paid
                            </button>
                        </form>

                        <span th:if="${order.paymentStatus != null
                  and order.paymentStatus.equalsIgnoreCase('PAID')}"
                              class="badge bg-success">
        Paid
    </span>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="10" class="empty-message">
                        No orders have been placed yet.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
