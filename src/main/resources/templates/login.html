<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login - Product Portal</title>
    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
    <style>
        /* Forced Green Success Alert Style */
        .alert-success {
            color: #0f5132 !important;
            background-color: #d1e7dd !important;
            border: 1px solid #badbcc !important;
            padding: 12px 16px !important;
            border-radius: 8px !important;
            margin-bottom: 15px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            text-align: center !important;
            display: block !important;
        }

        /* Error Alert Style */
        .error {
            color: #842029 !important;
            background-color: #f8d7da !important;
            border: 1px solid #f5c2c7 !important;
            padding: 12px 16px !important;
            border-radius: 8px !important;
            margin-bottom: 15px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            text-align: center !important;
            display: block !important;
        }

        /* Logout Message Style */
        .logout {
            color: #084298 !important;
            background-color: #cff4fc !important;
            border: 1px solid #b6effb !important;
            padding: 12px 16px !important;
            border-radius: 8px !important;
            margin-bottom: 15px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            text-align: center !important;
            display: block !important;
        }

        /* Inline Spinner Animation */
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: -1px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-button.btn-loading {
            pointer-events: none;
            opacity: 0.8;
        }

        /* ===== Mobile: correct size + no zoom when tapping a field ===== */
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }

        /* Phones zoom into any field whose text is smaller than 16px, so keep it at 16px */
        .auth-card input,
        .auth-card select,
        .auth-card textarea {
            font-size: 16px !important;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 28px 20px;
                margin: 16px auto;
            }

            .auth-card input {
                padding: 14px 14px;
            }

            .auth-button {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="logo">🛍️</div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to your Product Portal
    </p>

    <!-- Registration Success Message -->
    <div th:if="${param.success}" class="alert-success">
        ✅ Registration successful! Please login with your credentials.
    </div>

    <!-- Login Error -->
    <div th:if="${param.error}" class="error">
        Invalid username or password
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}" class="logout">
        You have been logged out successfully
    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login}" method="post">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Enter your username"
                   required>
        </div>

        <div class="form-group">


            <label for="password">
                Password
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

        </div>

        <button type="submit" id="loginBtn" class="auth-button">
            LOGIN
        </button>

    </form>


    <div class="auth-link">
        New user?
        <a th:href="@{/register}">
            Create an account
        </a>
    </div>

</div>

<!-- Global scripts -->
<div th:insert="~{layout :: scripts}"></div>
</body>
</html>
