<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login - Product Portal</title>
    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
    <style>
        /* Forced Green Success Alert Style */
        .alert-success {
            color: #0f5132 !important;
            background-color: #d1e7dd !important;
            border: 1px solid #badbcc !important;
            padding: 12px 16px !important;
            border-radius: 8px !important;
            margin-bottom: 15px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            text-align: center !important;
            display: block !important;
        }

        /* Error Alert Style */
        .error {
            color: #842029 !important;
            background-color: #f8d7da !important;
            border: 1px solid #f5c2c7 !important;
            padding: 12px 16px !important;
            border-radius: 8px !important;
            margin-bottom: 15px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            text-align: center !important;
            display: block !important;
        }

        /* Logout Message Style */
        .logout {
            color: #084298 !important;
            background-color: #cff4fc !important;
            border: 1px solid #b6effb !important;
            padding: 12px 16px !important;
            border-radius: 8px !important;
            margin-bottom: 15px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            text-align: center !important;
            display: block !important;
        }

        /* Inline Spinner Animation */
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: -1px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-button.btn-loading {
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="logo">🛍️</div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to your Product Portal
    </p>

    <!-- Registration Success Message -->
    <div th:if="${param.success}" class="alert-success">
        ✅ Registration successful! Please login with your credentials.
    </div>

    <!-- Login Error -->
    <div th:if="${param.error}" class="error">
        Invalid username or password
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}" class="logout">
        You have been logged out successfully
    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login}" method="post" onsubmit="handleLoginSubmit(this)">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Enter your username"
                   required>
        </div>

        <div class="form-group">


            <label for="password">
                Password
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

        </div>

        <button type="submit" id="loginBtn" class="auth-button">
            LOGIN
        </button>

    </form>


    <div class="auth-link">
        New user?
        <a th:href="@{/register}">
            Create an account
        </a>
    </div>

</div>

<!-- Inline Loader Script for Login -->
<script>
    function handleLoginSubmit(form) {
        const btn = document.getElementById("loginBtn");
        if (!btn || btn.classList.contains("btn-loading")) return;

        btn.classList.add("btn-loading");
        btn.innerHTML = '<span class="btn-spinner"></span> LOGGING IN...';
    }
</script>

<!-- Global scripts -->
<div th:insert="~{layout :: scripts}"></div>
</body>
</html>
