<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login - Product Portal</title>
    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-card">

    <div class="logo">🛍️</div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to your Product Portal
    </p>

    <!-- Login Error -->
    <div th:if="${param.error}" class="error">
        Invalid username or password
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}" class="logout">
        You have been logged out successfully
    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login}" method="post">

        <div class="form-group">

        <label for="username">
            Username
        </label>

        <input type="text"
               id="username"
               name="username"
               placeholder="Enter your username"
               required>
        </div>

        <div class="form-group">


        <label for="password">
            Password
        </label>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your password"
               required>

        </div>

        <button type="submit" class="auth-button">
            LOGIN
        </button>

    </form>


    <div class="auth-link">
        New user?
        <a th:href="@{/register}">
            Create an account
        </a>
    </div>

</div>

</body>
</html>
